name: Tag catalog version

on:
  push:
    branches:
      - main
    paths:
      - "glittering_bank_api/config.yaml"
      - ".github/workflows/tag-version.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and tag the catalog version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)"/\1/p' glittering_bank_api/config.yaml)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Glittering Bank Home Assistant ${VERSION}"
          git push origin "$TAG"

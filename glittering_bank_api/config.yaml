name: "Glittering Bank API"
version: "2.8.4"
slug: "glittering_bank_api"
description: "API bancaire persistante avec SQLite, passkeys, TOTP et synchronisation Actual Budget"
url: "https://github.com/philfer/glitteringprizes-ha"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
image: "ghcr.io/philfer/glittering-bank-api"
ports:
  5080/tcp: 5080
ports_description:
  5080/tcp: "API HTTP locale"
webui: "http://[HOST]:[PORT:5080]/health"
watchdog: "http://[HOST]:[PORT:5080]/health"
options:
  api_key: null
  activation_code: ""
  actual_enabled: false
  actual_server_url: "http://172.30.32.1:5006"
  actual_password: ""
  actual_sync_id: ""
  actual_encryption_password: ""
  actual_sync_interval_minutes: 60
  actual_lookback_days: 120
  actual_run_bank_sync: true
schema:
  api_key: password
  activation_code: password?
  actual_enabled: bool
  actual_server_url: str
  actual_password: password?
  actual_sync_id: str?
  actual_encryption_password: password?
  actual_sync_interval_minutes: int
  actual_lookback_days: int
  actual_run_bank_sync: bool
